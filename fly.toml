# Fly.io deployment.
#
#   fly launch --no-deploy --copy-config     # once, to claim the app name
#   fly secrets set ANTHROPIC_API_KEY=sk-...
#   fly deploy
#
# One machine, stopped when nobody is looking. The demo is a portfolio link
# rather than a service: it should cost nothing at rest and be honest about
# what it is when someone opens it.

app = "papercast"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # Uploads off, fixed shelf on. See lib/demo for what this actually changes.
  DEMO_MODE = "1"
  DEMO_MAX_MINUTES = "4"
  DEMO_CONCURRENT_JOBS = "1"
  DEMO_DAILY_JOBS = "25"
  # Questions are gated separately, and more generously: each is a handful of
  # calls rather than minutes of model time, and the shelf staying askable is
  # what a visitor gets once the day's episodes are spent.
  DEMO_CONCURRENT_QUESTIONS = "2"
  DEMO_DAILY_QUESTIONS = "200"
  # The deployment holds credentials for exactly one provider; the local model
  # option in the UI points at an Ollama server that exists on a laptop.
  LLM_PROVIDER = "anthropic"
  # The image's own default, repeated here because this file would otherwise
  # override it — and Piper is what made the first deployed episodes sound flat.
  TTS_PROVIDER = "kokoro"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero. A job holds an SSE connection open for its whole life, so a
  # machine cannot be stopped out from under an episode being made.
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # Synthesis holds a neural voice model in memory beside the Node server.
  # Kokoro's weights are about 330 MB and onnxruntime wants room to work beside
  # them, which 1 GB does not leave once Node has taken its share.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
